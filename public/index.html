<!DOCTYPE html>
<html>
<head>
<title>Hospital Patient System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Hospital Patient Management</h1>

<div class="container">

<h2>Add / Update Patient</h2>

<form id="patientForm">

<input type="hidden" id="patientId">

<input type="text" id="fullName" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="phoneNumber" placeholder="Phone Number" required>
<input type="number" id="age" placeholder="Age">

<input type="text" id="disease" placeholder="Disease" required>
<input type="text" id="doctorAssigned" placeholder="Doctor Assigned" required>

<button type="submit">Save Patient</button>

</form>

<h2>Patient List</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Disease</th>
<th>Doctor</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="patientTable"></tbody>

</table>

</div>

<script src="script.js"></script>

</body>
</html>
